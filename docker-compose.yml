services:
  ytnoti-discord:
    build: .
    image: ytnoti-discord:latest
    container_name: ytnoti-discord
    restart: unless-stopped
    init: true                      # clean SIGTERM handling
    ports:
      # Behind a reverse proxy on the same host, bind to loopback instead:
      #   - "127.0.0.1:8000:8000"
      - "8000:8000"
    env_file:
      - .env                        # DISCORD_WEBHOOK_URL=... (see .env.example)
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ytnoti-data:/data
    # Hardening (the app only needs to write to /data)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # If the container cannot reach its own public URL (home server without
    # NAT hairpinning), map your domain to the host. See README > Troubleshooting.
    # extra_hosts:
    #   - "yt.example.com:host-gateway"

volumes:
  ytnoti-data:
