name: CI

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to build'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python modules
        run: python -m compileall -q ytnoti_discord tests

      - name: Run test suite
        run: python -m pytest -q

  container:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ytnoti-discord:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container CLI
        run: docker run --rm ytnoti-discord:ci --help

  docker-pr:
    name: Build PR Image
    runs-on: ubuntu-latest
    needs: container
    # Build for all PRs, including forks. Fork PRs get a read-only GITHUB_TOKEN
    # and can't push to GHCR, so this job never pushes — it saves the built
    # image as an artifact, and the pr-image-publish workflow pushes it from the
    # trusted base-repo context (where the write token is available). This keeps
    # untrusted PR code and write credentials in separate, non-overlapping runs.
    # release-please PRs are handled by docker-rc instead.
    if: |
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'release-please')
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # For pull_request events GITHUB_SHA is the ephemeral merge commit
      # (refs/pull/N/merge), not the PR's head commit. Tag with the head SHA so
      # the image tag matches the commit the contributor actually pushed.
      - name: Get short SHA
        id: meta
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "sha=${HEAD_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Read-only login so the build can pull the private CI base image.
      # Fork tokens are read-only, which is sufficient here (no push happens).
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ytnoti-discord-pr:${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Save image and metadata
        run: |
          docker save ytnoti-discord-pr:${{ github.event.pull_request.number }} -o image.tar
          mkdir -p meta
          echo "${{ github.event.pull_request.number }}" > meta/pr
          echo "${{ steps.meta.outputs.sha }}" > meta/sha

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-image
          path: |
            image.tar
            meta/
          retention-days: 1

  docker-rc:
    name: Build RC Image
    runs-on: ubuntu-latest
    needs: container
    if: |
      (
        github.event_name == 'pull_request' &&
        startsWith(github.head_ref, 'release-please') &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'workflow_dispatch' &&
        startsWith(github.ref_name, 'release-please')
      )
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out released source
        uses: actions/checkout@v4

      - name: Get version and lowercase repo
        id: meta
        run: |
          echo "version=$(cat version.txt)" >> $GITHUB_OUTPUT
          echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.repo }}-dev:rc-${{ steps.meta.outputs.version }}-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
